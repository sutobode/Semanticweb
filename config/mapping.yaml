# Authoritative canonical -> RDF mapping (PROJECT_SPEC 1.6.2, Sections 19 / D.3).
# required_fields: Section 12.2 — COMP-004 quarantine record thiếu field bắt buộc.
entity_types:
  HeritageSite: {class: "vh:HeritageSite", required_fields: [entity_id, entity_type, label_vi, source_url, retrieved_at, provenance]}
  AdministrativeArea: {class: "vh:AdministrativeArea", required_fields: [entity_id, entity_type, label_vi, provenance]}
  HistoricalPerson: {class: "vh:HistoricalPerson", required_fields: [entity_id, entity_type, label_vi, provenance]}
  HistoricalEvent: {class: "vh:HistoricalEvent", required_fields: [entity_id, entity_type, label_vi, provenance]}
  HistoricalPeriod: {class: "vh:HistoricalPeriod", required_fields: [entity_id, entity_type, label_vi, provenance]}
  HeritageComplex: {class: "vh:HeritageComplex", required_fields: [entity_id, entity_type, label_vi, provenance]}
  Organization: {class: "vh:Organization", required_fields: [entity_id, entity_type, label_vi, provenance]}
  ArchitecturalStyle: {class: "vh:ArchitecturalStyle", required_fields: [entity_id, entity_type, label_vi, provenance]}
  Museum: {class: "vh:Museum", required_fields: [entity_id, entity_type, label_vi, registry_id, registry_url, provenance]}
  IntangibleHeritage: {class: "vh:IntangibleHeritage", required_fields: [entity_id, entity_type, label_vi, registry_id, registry_category, registry_url, provenance]}
  NationalTreasure: {class: "vh:NationalTreasure", required_fields: [entity_id, entity_type, label_vi, registry_id, registry_url, provenance]}
  DocumentaryHeritage: {class: "vh:DocumentaryHeritage", required_fields: [entity_id, entity_type, label_vi, registry_id, registry_url, provenance]}
  Artisan: {class: "vh:Artisan", required_fields: [entity_id, entity_type, label_vi, registry_id, registry_url, provenance]}
  CulturalObject: {class: "vh:CulturalObject", required_fields: [entity_id, entity_type, label_vi, registry_id, registry_url, provenance]}
site_type_tokens:
  "lịch sử": vh:HistoricalSite
  "tôn giáo": vh:ReligiousSite
  "khảo cổ": vh:ArchaeologicalSite
  "kiến trúc": vh:ArchitecturalSite
registry_category_subclass:
  intangible_representative: vh:RepresentativeIntangibleHeritage
  intangible_urgent: vh:UrgentSafeguardingIntangibleHeritage
  national_intangible: vh:NationalIntangibleHeritage
literal_properties:
  label_vi: {predicate: "rdfs:label", lang: vi, required: true}
  description_vi: {predicate: "rdfs:comment", lang: vi, required: false}
  construction_year: {predicate: "vh:constructionYear", datatype: "xsd:gYear", required: false}
  recognition_year: {predicate: "vh:recognitionYear", datatype: "xsd:gYear", required: false}
  birth_year: {predicate: "vh:birthYear", datatype: "xsd:gYear", required: false}
  death_year: {predicate: "vh:deathYear", datatype: "xsd:gYear", required: false}
  address: {predicate: "vh:address", datatype: "xsd:string", required: false}
  level: {predicate: "vh:areaLevel", datatype: "xsd:string", required: false}
  source_page_id: {predicate: "vh:sourcePageId", datatype: "xsd:integer", required_when: wikipedia_enriched}
  source_title: {predicate: "vh:sourceTitle", datatype: "xsd:string", required_when: wikipedia_enriched}
coordinate_properties:
  lat: {predicate: "geo:lat", datatype: "xsd:decimal"}
  lon: {predicate: "geo:long", datatype: "xsd:decimal"}
relation_properties:
  located_in: {predicate: "vh:locatedIn"}
  parent_area: {predicate: "vh:locatedIn"}
  associated_persons: {predicate: "vh:associatedWithPerson"}
  associated_events: {predicate: "vh:associatedWithEvent"}
  periods: {predicate: "vh:belongsToPeriod"}
  part_of: {predicate: "vh:partOf"}
  member_sites: {predicate: "vh:hasMember"}
  recognized_by: {predicate: "vh:recognizedBy"}
  built_by: {predicate: "vh:builtBy", object_must_be: "vh:HistoricalPerson"}
  architectural_styles: {predicate: "vh:hasArchitecturalStyle"}
  historical_successors: {predicate: "vh:hasHistoricalSuccessor"}
  related_sites: {predicate: "vh:hasRelatedSite"}
provenance_properties:
  source_url: {predicates: ["dcterms:source", "prov:wasDerivedFrom"], required: true}

# ---------------------------------------------------------------------------
# Phần dưới đây chỉ COMP-004 (Canonical Mapper, M2) đọc; RDF generator bỏ qua.
# ---------------------------------------------------------------------------

# Ý nghĩa của từng cột registry (registry_fields) theo category. `default` áp cho
# mọi category không khai riêng. Giá trị là danh sách field canonical nhận cột đó:
#   located_in       -> tách tỉnh bằng config/areas.yaml, sinh AdministrativeArea + relations.located_in
#   recognition_year -> năm công nhận (bỏ số hiệu quyết định, M2-01)
#   site_types       -> chỉ áp cho entity_type HeritageSite (Section 19)
registry_field_roles:
  default:
    location: [address, location, located_in]
    location_evidence_url: [source_url]
    recognition_text: [recognition_year]
    type: [site_types]
  # Cột thứ 4 của bảng bảo vật là "nơi lưu giữ" (thường là tên bảo tàng), không
  # phải địa điểm hành chính -> current_holder, không sinh address.
  # holder_located_in (M2-31, DEC-M2-006): located_in = tỉnh của NƠI LƯU GIỮ, lấy từ
  # data/raw/holder_locations.jsonl (registry text -> bài Wikipedia của bảo tàng -> bảng tay
  # config/holder_locations.yaml); không có trong file thì chỉ nhận tên tỉnh có ngay trong chuỗi.
  national_treasures:
    location: [current_holder, holder_located_in]
    recognition_text: [recognition_year]
  # Di sản tư liệu (nguồn danh sách Wikipedia, DEC-M2-005): cột location là nơi lưu giữ.
  documentary_heritage:
    location: [custodian, holder_located_in]
    recognition_text: [recognition_year]

# Năm xây dựng từ infobox Wikipedia (chỉ HeritageSite). Key infobox đã chuẩn hóa
# (lowercase, khoảng trắng -> "_"). Giá trị ngoài [min_year, năm hiện tại] bị bỏ.
infobox_fields:
  construction_year:
    key_pattern: "(?:^|_)(?:năm_xây_dựng|xây_dựng|khởi_công|khởi_dựng|thành_lập|khánh_thành|hoàn_thành|built|established|founded)(?:$|_)"
    min_year: 1

# Quan hệ Wikipedia được map khi collector đánh dấu verified=true (M2-15).
wikipedia_relations:
  built_by: HistoricalPerson
  associated_persons: HistoricalPerson
  associated_events: HistoricalEvent
  periods: HistoricalPeriod
  architectural_styles: ArchitecturalStyle

