# M2-11 — Danh mục di tích quốc gia đặc biệt ghi loại hình bằng tiền tố viết tắt
# trong tên (ví dụ "DTLS và KTNT Cổ Loa"). Mỗi viết tắt -> một site_type; generator
# sau đó áp site_type_tokens ở trên (lịch sử/kiến trúc/khảo cổ). Chỉ áp cho HeritageSite.
site_type_label_abbreviations:
  prefix_pattern: "^(?:(?:DTLS|DTKTNT|DTKC|DLTC|KTNT|KC)(?:\\s*,\\s*|\\s+(?i:và)\\s+)?)+(?=\\s)"
  tokens:
    DTLS: "di tích lịch sử"
    DTKTNT: "di tích kiến trúc nghệ thuật"
    KTNT: "di tích kiến trúc nghệ thuật"
    DTKC: "di tích khảo cổ"
    KC: "di tích khảo cổ"
    DLTC: "danh lam thắng cảnh"

# COMP-003 — bản ghi bổ sung: "DTLS Đường Trường Sơn - Đường Hồ Chí Minh (bổ sung thêm 09 điểm di tích)"
# là quyết định bổ sung cho CÙNG di tích với "DTLS Đường Trường Sơn - Đường Hồ Chí Minh".
# Resolver gộp bản bổ sung vào bản gốc (cùng category, cùng tên sau khi bỏ viết tắt loại hình
# và phần "(bổ sung …)"); identity_map.jsonl ghi registry_id đã gộp. Không gộp nếu không có bản gốc.
# KHÔNG gộp các dòng trùng tên khác (ví dụ 3 "Tượng Avalokitesvara" là 3 bảo vật khác nhau).
registry_supplements:
  label_pattern: "\\s*\\((?:bổ sung|mở rộng)[^)]*\\)\\s*$"
  type_abbreviation_pattern: "^(?:(?:DTLS|DTKTNT|DTKC|DLTC|KTNT|KC)(?:\\s*,\\s*|\\s+(?:và|VÀ)\\s+)?)+\\s+"
