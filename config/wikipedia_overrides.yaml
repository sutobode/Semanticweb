# Map cứng registry -> bài Wikipedia tiếng Việt (COMP-001, ưu tiên cao nhất).
#
# Chỉ dùng cho trường hợp tên trên dsvh.gov.vn và tiêu đề Wikipedia khác nhau đến mức
# không có luật tổng quát an toàn. Mỗi dòng đã được kiểm tra tay (tên, tỉnh, nội dung bài).
# Khóa: (registry_category, label_vi) CHÍNH XÁC như trong data/raw/registry_records.jsonl.
# titles: 1 tiêu đề -> bài của cả record; >= 2 tiêu đề -> mapper tách record thành nhiều entity.
# Override bỏ qua luật bằng chứng tỉnh/thể loại nhưng tiêu đề vẫn phải tồn tại (theo redirect);
# tiêu đề không tồn tại -> record vào enrichment_failures với lý do "override title …".
#
# Nguồn: review thủ công của M2 (Hoangnn) ngày 2026-09-24 trên file m2_wiki_unmatched.json.
