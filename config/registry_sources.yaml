# --- Nguồn dạng danh sách bài viết (M2-26, src/vietheritage/registry/articles.py) -----------------
# Mục "Di tích quốc gia" chỉ có danh sách link bài giới thiệu (mỗi bài 1 di tích, ~16 trang x 10 bài),
# không có bảng. Record sinh ra cùng schema với record dạng bảng và được CỘNG vào category
# registry_category (bảng danh-muc-di-tich-quoc-gia-1753 chỉ có 6 dòng). Coverage của category = các
# di tích có bài giới thiệu trên dsvh.gov.vn, KHÔNG phải toàn bộ danh mục di tích quốc gia.
# - Bài không có số quyết định xếp hạng, bài xếp hạng "quốc gia đặc biệt", bài trùng tên với record đã có
#   (cùng category hoặc duplicate_categories) -> data/raw/registry_article_quarantine.jsonl.
# - Link không có breadcrumb về list_url (sidebar, "Thông báo mới"…) bị bỏ qua.
# - item_link_selector: null -> tự nhận link /<slug>-<id>; đặt CSS nếu khảo sát HTML thật thấy cần.
article_sources:
  - key: national_monuments_articles
    registry_category: national_monuments
    list_url: https://dsvh.gov.vn/di-tich-quoc-gia-130
    page_param: _pageIndex
    max_pages: 40
    item_link_selector: null
    duplicate_categories: [national_special_monuments, world_heritage]
    enabled: true
