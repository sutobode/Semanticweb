# Coverage universe (COMP-000, PROJECT_SPEC Phụ lục D.1). M2 sở hữu file này.
#
# Ghi chú M2 (xem docs/REGISTRY_SOURCES.md):
# - registry_url của record lấy từ link nằm trong ô label_vi; không cần selector riêng.
# - detail_link_selector để null: theo §7 "một list/table row hợp lệ là registry
#   record hoàn chỉnh"; chỉ bật lại khi đã khảo sát detail page thật và khai
#   thêm detail_fields: {ten_field: "css selector"} (M2-07). Khi đã khai, lỗi
#   detail page là blocking (REGISTRY_DETAIL_MISSING).
# - allow_empty_source: true — nhóm quyết định GIỮ category trong coverage universe dù
#   trang chính thức chưa công bố dòng dữ liệu nào (DEC-M2-001, bắt buộc có
#   empty_source_note.decision). Khi trang rỗng: category ghi 0/0 dòng, không lỗi,
#   liệt kê trong data/raw/registry_empty_sources.jsonl. Khi trang có dữ liệu: category
#   được thu thập bình thường ở lần crawl sau, không cần sửa code/config.
#   10 category có khóa này được khảo sát thật ngày 2026-09-23 (7 trang chỉ có bảng khung
#   rỗng, 3 trang không có bảng) — xem docs/REGISTRY_SOURCES.md §1.
#   Lỗi mạng/HTTP/parse vẫn là blocking cho mọi category.
base_url: https://dsvh.gov.vn/
request:
  timeout_seconds: 30
  retries: 3
  backoff_seconds: [2, 4, 8]
  delay_seconds: 1.0          # nghỉ giữa hai request tới site chính phủ
  user_agent: "VietHeritageLOD/1.0 (+registry collector)"
defaults:
  row_selector: "table tbody tr"
  next_page_selector: "a[rel=next]"
  max_pages: 50               # chặn vòng lặp pagination; dừng sớm khi fingerprint lặp
  footer_patterns: ["^Tổng số", "^Total"]
