# Bảng chuẩn hóa đơn vị hành chính cấp tỉnh (M2-10, DEC-M2-004).
#
# Hai lớp:
#   1. `areas` (63 tỉnh/thành TRƯỚC sắp xếp 2025) — lớp SO KHỚP. Registry dsvh.gov.vn và
#      nhiều bài Wikipedia vẫn ghi tên cũ, nên resolver nhận diện theo 63 tên này.
#   2. `merged_areas` (34 tỉnh/thành SAU sắp xếp, Nghị quyết 202/2025/QH15) — lớp CÔNG BỐ.
#      Khi `publish_level: merged_2025`, mapper sinh `relations.located_in` và entity
#      AdministrativeArea theo 34 đơn vị này (mỗi tỉnh cũ -> `merged_into`), bỏ trùng
#      (ví dụ "tỉnh Hải Dương (nay là TP Hải Phòng)" -> chỉ Hải Phòng).
#      `publish_level: source` quay về công bố đúng 63 tên như registry.
#   Ô địa điểm gốc vẫn giữ nguyên ở field `address` của record (provenance).
#
# Quy tắc khớp (deterministic, KHÔNG fuzzy — DEC-007):
#   - so khớp chính xác theo khóa chuẩn hóa: NFC, casefold, canonical dash,
#     chuẩn hóa vị trí dấu thanh kiểu cũ/mới (hoá = hóa), gộp khoảng trắng;
#   - label + mọi `match_variants` đều là chuỗi chính xác, liệt kê tường minh;
#   - bỏ qua lần xuất hiện đứng ngay sau tiền tố cấp dưới tỉnh
#     (xã, phường, thị trấn, huyện, quận, thị xã, thôn, làng) trong cùng đoạn;
#   - `district_hints` chỉ dùng khi không tìm thấy tên tỉnh nào.
#
# areas[*]:
#   label           : tên tỉnh cũ (dùng để khớp; công bố khi publish_level = source).
#   display_aliases : tên đầy đủ (skos:altLabel khi publish_level = source).
#   match_variants  : biến thể chỉ dùng để khớp (lỗi chính tả, viết tắt) — không công bố.
#   level           : vh:areaLevel khi publish_level = source.
#   merged_into     : label của đơn vị trong `merged_areas` (bắt buộc tồn tại). Dùng cho
#                     (a) công bố located_in khi publish_level = merged_2025,
#                     (b) so khớp bằng chứng tỉnh với Wikipedia / bài viết dsvh.
# merged_areas[*]:
#   label           : rdfs:label@vi công bố (CQ01 so khớp "Hà Nội"@vi).
#   level           : vh:areaLevel.
#   display_aliases : skos:altLabel.

publish_level: merged_2025        # merged_2025 | source

country_code: VN
sub_provincial_prefixes: ["xã", "phường", "thị trấn", "huyện", "quận", "thị xã", "thôn", "làng", "x.", "tx.", "tt.", "p."]

