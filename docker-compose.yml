services:
  fuseki:
    build:
      context: ./deployment/fuseki
      args:
        JENA_VERSION: ${JENA_VERSION:-4.10.0}
    image: vietheritage/fuseki:4.10.0
    container_name: vietheritage-fuseki
    user: "0:0"
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:${FUSEKI_PORT:-3031}:3030"
    volumes:
      - ./deployment/fuseki/config.ttl:/fuseki/config.ttl:ro
      - fuseki-data:/fuseki/databases
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Accept: application/sparql-results+json' --get --data-urlencode 'query=ASK WHERE {}' http://localhost:3030/vietheritage/sparql | grep -Eq '\"boolean\"[[:space:]]*:[[:space:]]*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26.0
    container_name: vietheritage-neo4j
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  explorer:
    build:
      context: .
      dockerfile: deployment/explorer/Dockerfile
    image: vietheritage/explorer:0.1.0
    container_name: vietheritage-explorer
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      VH_BASE_URI: http://localhost:3030/vietheritage
      FUSEKI_QUERY_URL: http://fuseki:3030/vietheritage/sparql
      FUSEKI_DATASET: vietheritage
      FUSEKI_USER: ${FUSEKI_USER:-admin}
      FUSEKI_ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:3030:8000"
    depends_on:
      - fuseki
    restart: unless-stopped

volumes:
  fuseki-data:
  neo4j-data:
