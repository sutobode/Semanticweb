[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietheritage-lod"
version = "0.1.0"
description = "VietHeritageLOD — A Linked Open Data Knowledge Graph for Vietnamese Cultural Heritage"
requires-python = ">=3.12,<3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
